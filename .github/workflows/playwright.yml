name: Playwright Tests (Docker + Allure)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🧠 Cache für npm (macht Builds deutlich schneller)
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-

      # 🐳 Docker Build (einmal pro Job)
      - name: Build Docker image
        run: docker build -t playwright-tests .

      # 🧪 Tests im Container ausführen (Shard)
      - name: Run tests (Shard ${{ matrix.shard }})
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/allure-results:/app/allure-results \
            playwright-tests \
            npx playwright test --shard=${{ matrix.shard }}/4

      # 📦 Allure Results speichern
      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.shard }}
          path: allure-results
          if-no-files-found: ignore

  allure-report:
    needs: test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 📥 Alle Shards laden
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          path: allure-results

      # 🧠 Merge sauberer (robuster als dein cp)
      - name: Merge results
        run: |
          mkdir merged-results
          find allure-results -name "*.json" -exec cp {} merged-results \;

      # 📊 Allure installieren
      - name: Install Allure CLI
        run: npm install -g allure-commandline

      # 📈 Report generieren
      - name: Generate Allure report
        run: allure generate merged-results --clean -o allure-report

      # 📤 Upload
      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report